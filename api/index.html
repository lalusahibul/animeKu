<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Reader Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .controls {
            margin: 20px 0;
            text-align: center;
        }

        select,
        button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: #1f1f1f;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        select {
            width: 300px;
            background-color: #2b2b2b;
        }

        button {
            background-color: #007bff;
        }

        button:hover {
            background-color: #0056b3;
        }

        #reader-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            min-height: 400px;
        }

        .manga-page {
            width: 100%;
            height: auto;
            margin-bottom: 5px;
            display: block;
            border-radius: 4px;
        }

        .loading {
            color: #aaa;
            font-style: italic;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h1 id="manga-title">Memuat Judul Manga...</h1>

    <div class="controls">
        <label for="chapter-select">Pilih Chapter: </label>
        <select id="chapter-select">
            <option value="">-- Memuat Chapter --</option>
        </select>
        <button onclick="loadChapterImages()">Baca Chapter</button>
    </div>

    <div id="reader-container">
        <p class="loading">Silakan pilih chapter di atas lalu klik "Baca Chapter".</p>
    </div>

    <script>
        const API_BASE = '';
        const chapterSelect = document.getElementById('chapter-select');
        const mangaTitle = document.getElementById('manga-title');
        const readerContainer = document.getElementById('reader-container');

        // 1. Ambil Daftar Chapter saat halaman pertama kali dibuka
        async function fetchChapters() {
            try {
                const response = await fetch(`${API_BASE}/api/manga/one-piece`);
                const result = await response.json();

                if (result.status === 'success') {
                    mangaTitle.innerText = result.data.judul;
                    chapterSelect.innerHTML = ''; // Kosongkan opsi loading

                    // Masukkan daftar chapter ke dalam elemen <select>
                    result.data.chapters.forEach(chap => {
                        const option = document.createElement('option');
                        option.value = chap.url;
                        option.textContent = chap.title;
                        chapterSelect.appendChild(option);
                    });
                } else {
                    mangaTitle.innerText = 'Gagal memuat judul manga';
                }
            } catch (error) {
                console.error('Error:', error);
                mangaTitle.innerText = 'Server API tidak aktif / Error koneksi';
            }
        }

        // 2. Ambil Gambar dari Chapter yang dipilih
        async function loadChapterImages() {
            const selectedUrl = chapterSelect.value;
            if (!selectedUrl) {
                alert('Silakan pilih chapter terlebih dahulu!');
                return;
            }

            readerContainer.innerHTML = '<p class="loading">Memuat gambar chapter...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/manga/chapter-images?url=${encodeURIComponent(selectedUrl)}`);
                const result = await response.json();

                if (result.status === 'success') {
                    readerContainer.innerHTML = ''; // Kosongkan area reader

                    if (result.images.length === 0) {
                        readerContainer.innerHTML = '<p class="loading">Tidak ada gambar ditemukan di chapter ini.</p>';
                        return;
                    }

                    // Buat tag <img> untuk setiap link gambar yang dikirim API
                    result.images.forEach(imgUrl => {
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        img.className = 'manga-page';
                        img.loading = 'lazy'; // Lazy loading agar halaman ringan saat di-scroll
                        readerContainer.appendChild(img);
                    });
                } else {
                    readerContainer.innerHTML = '<p class="loading">Gagal mengambil gambar chapter.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                readerContainer.innerHTML = '<p class="loading">Terjadi kesalahan koneksi ke server.</p>';
            }
        }

        // Jalankan fungsi saat halaman dimuat
        fetchChapters();
    </script>

</body>

</html>
