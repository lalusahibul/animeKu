<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animeKu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
        }

        .controls {
            margin: 20px 0;
            text-align: center;
        }

        select,
        button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: #1f1f1f;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        select {
            width: 300px;
            background-color: #2b2b2b;
        }

        button {
            background-color: #007bff;
        }

        button:hover {
            background-color: #0056b3;
        }

        #reader-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            min-height: 400px;
            flex: 1;
        }

        .manga-page {
            width: 100%;
            height: auto;
            margin-bottom: 5px;
            display: block;
            border-radius: 4px;
        }

        .loading {
            color: #aaa;
            font-style: italic;
            margin-top: 50px;
        }

        footer {
            margin-top: 40px;
            padding: 20px 0;
            text-align: center;
            color: #888888;
            font-size: 14px;
            border-top: 1px solid #2b2b2b;
            width: 100%;
            max-width: 800px;
        }

        .chapter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 800px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background-color: #1a1a1a;
            border-radius: 6px;
            border: 1px solid #2b2b2b;
        }

        .chapter-btn {
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 4px;
            border: none;
            background-color: #2b2b2b;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .chapter-btn:hover {
            background-color: #007bff;
        }
    </style>
</head>

<body>

    <h1 id="manga-title">Memuat Judul Manga...</h1>

    <div class="controls">
        <h3>Daftar Chapter:</h3>

        <div id="chapter-list-container" class="chapter-grid"></div>
    </div>

    <div id="reader-container">
        <p class="loading">Silakan pilih chapter di atas lalu klik "Baca Chapter".</p>
    </div>

    <footer>
        <p>&copy; 2026 animeKu by <a href="https://instagram.com/lalusahibul_" target="_blank">ibul</a></p>
    </footer>

    <script>
        const API_BASE = '';

        const mangaTitle = document.getElementById('manga-title');
        const chapterListContainer = document.getElementById('chapter-list-container');
        const readerContainer = document.getElementById('reader-container');

        // 1. Ambil Daftar Chapter dan Buat Tombolnya
        async function fetchChapters() {
            try {
                const response = await fetch(`${API_BASE}/api/manga/one-piece`);
                const result = await response.json();

                if (result.status === 'success') {
                    mangaTitle.innerText = result.data.judul;
                    chapterListContainer.innerHTML = '';

                    result.data.chapters.forEach(chap => {
                        const btn = document.createElement('button');
                        btn.className = 'chapter-btn';
                        btn.textContent = chap.title;

                        btn.onclick = () => loadChapterImages(chap.url);

                        chapterListContainer.appendChild(btn);
                    });
                } else {
                    mangaTitle.innerText = 'Gagal memuat judul manga';
                }
            } catch (error) {
                console.error('Error:', error);
                mangaTitle.innerText = 'Server API tidak aktif / Error koneksi';
            }
        }

        // 2. Ambil Gambar dari Chapter yang Dipilih via Tombol
        async function loadChapterImages(chapterUrl) {
            if (!chapterUrl) return;

            readerContainer.innerHTML = '<p class="loading">Memuat gambar chapter...</p>';

            try {
                const response = await fetch(`${API_BASE}/api/manga/chapter-images?url=${encodeURIComponent(chapterUrl)}`);
                const result = await response.json();

                if (result.status === 'success') {
                    readerContainer.innerHTML = '';

                    if (result.images.length === 0) {
                        readerContainer.innerHTML = '<p class="loading">Tidak ada gambar ditemukan di chapter ini.</p>';
                        return;
                    }
                    result.images.forEach(imgUrl => {
                        const img = document.createElement('img');
                        img.src = imgUrl;
                        img.className = 'manga-page';
                        img.loading = 'lazy';
                        readerContainer.appendChild(img);
                    });
                } else {
                    readerContainer.innerHTML = '<p class="loading">Gagal mengambil gambar chapter.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                readerContainer.innerHTML = '<p class="loading">Terjadi kesalahan koneksi ke server.</p>';
            }
        }

        fetchChapters();
    </script>

</body>

</html>
